# yaml-language-server: $schema=./serverk.schema.json
schemaVersion: serverk.gg/v1
kind: GamePackage

metadata:
  id: hytale
  name:
    ar: هايتيل
    en: Hytale
  description:
    ar: سيرفر هايتيل — عالم مكعبات مفتوح، مغامرات، بناء، وقتال مع أصحابك. عالمك محفوظ على سيرفرك وشغّال 24 ساعة. تسجّل دخوله مرة وحدة بحساب هايتيل حقك، وبعدها يحدّث نفسه على طول.
    en: Hytale dedicated servers — an open block world of adventure, building and combat with your friends. Your world lives on your server and runs around the clock. You sign it in once with your own Hytale account, and it keeps itself updated from then on.
  tagline:
    ar: عالمك في هايتيل مع أصحابك — سيرفرك جاهز خلال دقيقة
    en: Your Hytale world with your friends — your server, ready in a minute
  category: sandbox
  logo: assets/logo.webp
  banner: assets/banner.webp

resources:
  minMemoryMb: 4096
  recommendedMemoryMb: 8192
  minDiskMb: 20480
  playersPerMemoryGb: 4
  maxRecommendedPlayers: 64

container:
  image: serverkgg/hytale
  ports:
    - key: game
      containerPort: 5520
      protocol: udp
      name:
        ar: هايتيل
        en: Hytale
      hint:
        ar: من داخل اللعبة افتح Multiplayer ثم Direct Connect واكتب العنوان والمنفذ مع بعض زي ما هو.
        en: In the game open Multiplayer then Direct Connect and type the address and port together, exactly as shown.
      hostRange:
        default: 5520
        min: 5520
        max: 5569

secrets:
  - key: CURSEFORGE_API_KEY
    description:
      ar: مفتاح CurseForge API — بدونه يقفل كتالوج مودات هايتيل، ويبقى الرفع اليدوي لمجلد المودات هو الطريق الوحيد.
      en: CurseForge API key — without it the Hytale mod catalog stays off and uploading to the mods folder by hand is the only way.
    required: false

backup:
  only:
    - Server/universe/**
    - Server/config.json
    - Server/permissions.json
    - Server/bans.json
    - Server/mods/**
    - Server/auth.enc
    - Server/auth.key
    - config.json
    - permissions.json
    - auth.enc
    - auth.key
    - .serverk-install.json

reset:
  keep:
    - Assets.zip
    - start.sh
    - start.bat
    - jvm.options
    - Server/HytaleServer.jar
    - Server/HytaleServer.aot
    - Server/Licenses
    - Server/auth.enc
    - Server/auth.key
    - auth.enc
    - auth.key
    - .serverk-install.json

presence:
  name: player
  id: playerId
  avatar: "serverk://avatars/hytale/{playerId}"

files:
  protected:
    - Assets.zip
    - start.sh
    - start.bat
    - jvm.options
    - HytaleServer.jar
    - .serverk-install.json
    - auth.enc
    - auth.key
    - Server/HytaleServer.jar
    - Server/HytaleServer.aot
    - Server/Licenses/**
    - Server/auth.enc
    - Server/auth.key
    - Server/mods/.serverk-mods.json
    - earlyplugins/**
    - updater/**
  notable:
    - match: Server/config.json
      label:
        ar: إعدادات
        en: Settings
      icon: settings
      color: "#5ba32b"
      restart: true
      note:
        ar: إعدادات السيرفر كاملة — الاسم، الرسالة الترحيبية، كلمة المرور، وعدد اللاعبين. عدّلها من تبويب الإعدادات أحسن، وأي تعديل يبي إعادة تشغيل.
        en: Every server setting — name, MOTD, password and player slots. The Settings tab is the easier way, and any change needs a restart.
    - match: Server/universe
      label:
        ar: بيانات العالم
        en: World data
      icon: map
      color: "#4a8fd4"
      note:
        ar: عوالمك وبيانات اللاعبين. لا تعدّل عليه والسيرفر شغّال، وخذ نسخة احتياطية قبل أي شي.
        en: Your worlds and the player data. Do not touch it while the server runs, and take a backup first.
    - match: Server/mods
      label:
        ar: المودات
        en: Mods
      icon: puzzle
      color: "#c77dff"
      restart: true
      note:
        ar: مجلد المودات. حط ملف المود هنا زي ما هو (zip. أو jar.) وأعد التشغيل عشان يشتغل. اللاعبين ما يركّبون شي عندهم — سيرفرك يوصّل لهم المودات أول ما يدخلون. الأسهل تركّبها من تبويب المودات.
        en: Your mods folder. Drop the mod file in as it is (.zip or .jar) and restart for it to load. Your players install nothing — your server streams the mods to them as they join. The Mods tab is the easier way.
    - match: earlyplugins
      label:
        ar: إضافات مبكّرة
        en: Early plugins
      icon: shield
      color: "#8c8c8c"
      note:
        ar: هايتيل نفسها تقول إن الإضافات المبكّرة غير مدعومة وتعطّل السيرفر، وسيرفرك ما يشغّلها. حط موداتك في Server/mods بدالها.
        en: Hytale itself calls early plugins unsupported and unstable, and Serverk never enables them. Put your mods in Server/mods instead.
    - match: Server/permissions.json
      label:
        ar: الصلاحيات والقائمة البيضاء
        en: Permissions and whitelist
      icon: shield
      color: "#f2a33c"
      restart: true
      note:
        ar: صلاحيات اللاعبين، والقائمة البيضاء معها — اللي عنده صلاحية hytale.server.join يقدر يدخل لما تفعّلها. الأسهل تديرها من تبويب التحكم.
        en: Player permissions, and the whitelist with them — whoever holds hytale.server.join may join while it is on. The Controls tab is the easier way to manage it.
    - match: Server/backups
      label:
        ar: نسخ السيرفر
        en: Server snapshots
      icon: box
      color: "#8c8c8c"
      note:
        ar: نسخ يحفظها سيرفر هايتيل بنفسه كل نص ساعة وقبل أي تحديث. النسخ الاحتياطية اللي تعتمد عليها من تبويب النسخ الاحتياطية.
        en: Snapshots the Hytale server keeps on its own every half hour and before any update. The backups you rely on live in the Backups tab.

guideTags:
  - id: start
    name:
      ar: ابدأ من هنا
      en: Start here
  - id: updates
    name:
      ar: التحديثات
      en: Updates
  - id: mods
    name:
      ar: المودات
      en: Mods

guides:
  - id: getting-started
    title:
      ar: البدء بسيرفرك
      en: Getting started
    summary:
      ar: أنشئ سيرفر هايتيل، سجّل دخوله مرة وحدة، وادخل مع أصحابك.
      en: Create your Hytale server, sign it in once, and join with your friends.
    tags:
      - start
    surfaces:
      - overview
      - setup
    bodyPath:
      ar: guides/getting-started/ar.md
      en: guides/getting-started/en.md
  - id: updates
    title:
      ar: تحديثات هايتيل
      en: Hytale updates
    summary:
      ar: ليش سيرفرك يحدّث نفسه كل ما يشتغل، ووش يصير لما تنزل نسخة جديدة من اللعبة.
      en: Why your server updates itself on every boot, and what happens when a new game version ships.
    tags:
      - updates
    surfaces:
      - overview
      - console
    bodyPath:
      ar: guides/updates/ar.md
      en: guides/updates/en.md
  - id: mods
    title:
      ar: مودات هايتيل
      en: Hytale mods
    summary:
      ar: ركّب مودات على سيرفرك بدون ما يركّب لاعبينك أي شي عندهم.
      en: Install mods on your server without your players installing anything.
    tags:
      - mods
    surfaces:
      - overview
      - panel
      - files
    bodyPath:
      ar: guides/mods/ar.md
      en: guides/mods/en.md
