# yaml-language-server: $schema=./serverk.schema.json
schemaVersion: serverk.gg/v1
kind: GamePackage

metadata:
  id: hytale
  name:
    ar: هايتيل
    en: Hytale
  description:
    ar: سيرفر هايتيل للمغامرات والبناء والقتال مع أصحابك في ماب مفتوح من المكعبات. مابك محفوظ على سيرفرك وشغّال على مدار 24 ساعة. سجّل دخول السيرفر مرة واحدة بحساب هايتيل الخاص بك، وبعدها يحدّث نفسه تلقائيًا.
    en: Hytale dedicated servers for adventure, building and combat with your friends in an open block world. Your world lives on your server and runs around the clock. You sign it in once with your own Hytale account, and it keeps itself updated from then on.
  tagline:
    ar: مابك في هايتيل مع أصحابك، وسيرفرك جاهز خلال دقيقة
    en: Your Hytale world with your friends, with your server ready in a minute
  category: sandbox
  logo: assets/logo.webp
  banner: assets/banner.webp
  extensions:
    - kind: mods
      sources:
        - curseforge

resources:
  minMemoryMb: 4096
  recommendedMemoryMb: 8192
  minDiskMb: 20480
  playersPerMemoryGb: 4
  maxRecommendedPlayers: 64

container:
  image: serverkgg/hytale
  runtime:
    platform: linux
    installBudgetMinutes: 15
    bootBudgetMinutes: 12
    shmMb: 64
    pidsLimit: 512
  ports:
    - key: game
      containerPort: 5520
      protocol: udp
      name:
        ar: هايتيل
        en: Hytale
      hint:
        ar: من داخل اللعبة افتح Multiplayer ثم Direct Connect، واكتب العنوان والمنفذ معًا كما يظهران.
        en: In the game, open Multiplayer, then Direct Connect, and type the address and port together, exactly as shown.
      hostRange:
        default: 5520
        min: 5520
        max: 5569

secrets:
  - key: CURSEFORGE_API_KEY
    description:
      ar: مفتاح CurseForge API. بدونه يبقى كتالوج مودات هايتيل موقوفًا، ويصبح الرفع اليدوي إلى مجلد المودات الطريقة الوحيدة.
      en: CurseForge API key. Without it, the Hytale mod catalog stays off and uploading to the mods folder by hand is the only way.
    required: false

backup:
  only:
    - Server/universe/**
    - Server/config.json
    - Server/permissions.json
    - Server/bans.json
    - Server/mods/**
    - Server/auth.enc
    - Server/auth.key
    - config.json
    - permissions.json
    - auth.enc
    - auth.key
    - .serverk-install.json

reset:
  keep:
    - Assets.zip
    - start.sh
    - start.bat
    - jvm.options
    - Server/HytaleServer.jar
    - Server/HytaleServer.aot
    - Server/Licenses
    - Server/auth.enc
    - Server/auth.key
    - auth.enc
    - auth.key
    - .serverk-install.json

presence:
  name: player
  id: playerId
  avatar: "serverk://avatars/hytale/{playerId}"
  fields:
    - key: account
      label:
        ar: الحساب
        en: Account

files:
  protected:
    - .serverk-install.json
    - Server/mods/.serverk-mods.json
  notable:
    - match: Server/config.json
      label:
        ar: إعدادات
        en: Settings
      icon: settings
      color: "#5ba32b"
      restart: true
      note:
        ar: "كل إعدادات السيرفر: الاسم ورسالة الترحيب وكلمة المرور وعدد اللاعبين. الأسهل تعديلها من تبويب الإعدادات، وأي تعديل يتطلب ريستارت."
        en: "Every server setting: name, welcome message, password and player slots. The Settings tab is the easier way, and any change needs a restart."
    - match: Server/universe
      label:
        ar: بيانات المابات
        en: World data
      icon: map
      color: "#4a8fd4"
      note:
        ar: ماباتك وبيانات اللاعبين. لا تعدّل عليها والسيرفر شغّال، وخذ نسخة احتياطية قبل أي تعديل.
        en: Your worlds and the player data. Don't change them while the server runs, and take a backup first.
    - match: Server/mods
      label:
        ar: المودات
        en: Mods
      icon: puzzle
      color: "#c77dff"
      restart: true
      note:
        ar: مجلد المودات. ضع ملف المود هنا كما هو (zip. أو jar.)، ويشتغل بعد الريستارت. لا يلزم اللاعبين تثبيت أي شيء، فسيرفرك يرسل إليهم المودات عند دخولهم. الأسهل تثبيتها من تبويب المودات.
        en: Your mods folder. Drop the mod file in as it is (.zip or .jar). It loads after a restart. Your players install nothing, because your server streams the mods to them as they join. The Mods tab is the easier way.
    - match: earlyplugins
      label:
        ar: إضافات مبكّرة
        en: Early plugins
      icon: shield
      color: "#8c8c8c"
      note:
        ar: تصف هايتيل نفسها الإضافات المبكّرة بأنها غير مدعومة وتعطّل السيرفر، ولا تفعّلها منصة سيرفرك أبدًا. ضع موداتك في Server/mods بدلًا منها.
        en: Hytale itself calls early plugins unsupported and unstable, and Serverk never enables them. Put your mods in Server/mods instead.
    - match: Server/permissions.json
      label:
        ar: الصلاحيات والقائمة البيضاء
        en: Permissions and whitelist
      icon: shield
      color: "#f2a33c"
      restart: true
      note:
        ar: صلاحيات اللاعبين والقائمة البيضاء معها. عند تفعيل القائمة، يستطيع الدخول كل من يملك صلاحية hytale.server.join. الأسهل إدارتها من تبويب التحكم.
        en: Player permissions, and the whitelist with them. Whoever holds hytale.server.join can join while it's on. The Controls tab is the easier way to manage it.
    - match: Server/backups
      label:
        ar: لقطات السيرفر
        en: Server snapshots
      icon: box
      color: "#8c8c8c"
      note:
        ar: لقطات يحفظها سيرفر هايتيل بنفسه كل نصف ساعة وقبل أي تحديث. أما النسخ الاحتياطية التي تعتمد عليها فتجدها في تبويب النسخ الاحتياطية.
        en: Snapshots the Hytale server keeps on its own every half hour and before any update. The backups you rely on live in the Backups tab.

guideTags:
  - id: start
    name:
      ar: ابدأ من هنا
      en: Start here
  - id: updates
    name:
      ar: التحديثات
      en: Updates
  - id: mods
    name:
      ar: المودات
      en: Mods

guides:
  - id: getting-started
    title:
      ar: البدء بسيرفرك
      en: Getting started
    summary:
      ar: أنشئ سيرفر هايتيل، وسجّل دخوله مرة واحدة، وادخل مع أصحابك.
      en: Create your Hytale server, sign it in once, and join with your friends.
    tags:
      - start
    surfaces:
      - overview
      - setup
    bodyPath:
      ar: guides/getting-started/ar.md
      en: guides/getting-started/en.md
  - id: updates
    title:
      ar: تحديثات هايتيل
      en: Hytale updates
    summary:
      ar: لماذا يحدّث سيرفرك نفسه مع كل تشغيل، وما الذي يحدث عند صدور إصدار جديد من اللعبة.
      en: Why your server updates itself on every boot, and what happens when a new game version ships.
    tags:
      - updates
    surfaces:
      - overview
      - console
      - backups
    bodyPath:
      ar: guides/updates/ar.md
      en: guides/updates/en.md
  - id: mods
    title:
      ar: مودات هايتيل
      en: Hytale mods
    summary:
      ar: ثبّت مودات على سيرفرك دون أن يثبّت لاعبوك أي شيء.
      en: Install mods on your server without your players installing anything.
    tags:
      - mods
    surfaces:
      - overview
      - panel
      - files
    bodyPath:
      ar: guides/mods/ar.md
      en: guides/mods/en.md
